<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vela roster</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --ink: #10202c; --dim: #5d6f7c; --line: #dbe2e8;
    --live: #1a8f4c; --muted: #c0392b; --warn-bg: #fff3d6; --warn-ink: #6b4a00;
    --talk: #0b6bcb; --talk-bg: #e6f1fc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0c141a; --card: #15212a; --ink: #e9f0f4; --dim: #8fa3b0; --line: #26363f;
      --live: #3ddc84; --muted: #ff6b5e; --warn-bg: #3a2e10; --warn-ink: #ffd88a;
      --talk: #5fb2ff; --talk-bg: #12293d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px 16px 40px; background: var(--bg); color: var(--ink);
         font: 18px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  h1 { font-size: 28px; margin: 0; }
  #count { color: var(--dim); font-variant-numeric: tabular-nums; }
  #status { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 15px; margin: -8px 0 16px; }
  #pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); flex: none; }
  #status.is-ok #pulse { background: var(--live); animation: pulse 2s ease-in-out infinite; }
  #status.is-deaf #pulse { background: var(--muted); }
  @keyframes pulse { 50% { opacity: .35; } }
  #problem { display: none; background: var(--warn-bg); color: var(--warn-ink);
             padding: 12px 14px; border-radius: 10px; margin-bottom: 16px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
            margin-bottom: 16px; overflow: hidden; }
  h2 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
       margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line);
       transition: background-color .15s; }
  li:last-child { border-bottom: 0; }
  .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--live); }
  .is-muted .dot { background: var(--muted); }
  .name { font-size: 22px; font-weight: 600; overflow-wrap: anywhere; }
  .state { color: var(--live); font-weight: 600; }
  .is-muted .state { color: var(--muted); }
  .since { color: var(--dim); font-size: 15px; font-variant-numeric: tabular-nums; }
  .who { flex: 1; min-width: 0; }
  .who .name { display: block; }
  .spoke { color: var(--dim); font-size: 15px; font-variant-numeric: tabular-nums; min-height: 1.4em; }
  /* Talking: three bars in place of the dot, and the row lights up. */
  .bars { display: none; width: 14px; height: 18px; flex: none; align-items: flex-end; gap: 2px; }
  .bars i { flex: 1; height: 30%; background: var(--talk); border-radius: 1px; animation: bar .7s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay: .15s; }
  .bars i:nth-child(3) { animation-delay: .3s; }
  @keyframes bar { 50% { height: 100%; } }
  .is-speaking { background: var(--talk-bg); }
  .is-speaking .dot { display: none; }
  .is-speaking .bars { display: flex; }
  .is-speaking .state { color: var(--talk); }
  @media (prefers-reduced-motion: reduce) {
    .bars i, #status.is-ok #pulse { animation: none; }
    .bars i { height: 100%; }
    .bars i:nth-child(2) { height: 60%; }
  }
  .empty { color: var(--dim); padding: 14px 16px; }
</style>
</head>
<body>
<main>
  <header><h1 id="boat">Vela</h1><span id="count"></span></header>
  <!-- The test bench, for one person testing several phones, is at /test -->
  <div id="status"><span id="pulse"></span><span id="status-text">Connecting</span></div>
  <div id="problem"></div>
  <div id="channels"></div>
</main>
<script>
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const since = (t) => {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - t));
  if (s < 60) return s + " s";
  if (s < 3600) return Math.floor(s / 60) + " min";
  return Math.floor(s / 3600) + " h " + Math.floor((s % 3600) / 60) + " min";
};
// Who is talking, asked for four times a second and painted onto the rows already on screen.
let talking = new Set();
let lastSpoke = {};
let listening = false;
let reachable = false;
const ago = (t) => {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - t));
  if (s < 2) return "just now";
  if (s < 60) return s + " s ago";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  return Math.floor(s / 3600) + " h ago";
};
function paint() {
  for (const li of document.querySelectorAll("li[data-id]")) {
    const id = li.dataset.id;
    const speaking = talking.has(id) && !li.classList.contains("is-muted");
    li.classList.toggle("is-speaking", speaking);
    li.querySelector(".state").textContent = speaking ? "Talking" : li.dataset.state;
    li.querySelector(".spoke").textContent =
      speaking ? "Talking now" : (lastSpoke[id] ? "Last heard " + ago(lastSpoke[id]) : (listening ? "Not heard yet" : ""));
  }
  const status = document.getElementById("status");
  status.className = !reachable ? "" : (listening ? "is-ok" : "is-deaf");
  document.getElementById("status-text").textContent =
    !reachable ? "Not connected to the base station"
    : listening ? (talking.size ? "Listening · " + talking.size + " talking" : "Listening · quiet")
    : "Cannot tell who is talking: no seat on the audio server";
}
async function listen() {
  try {
    const a = await (await fetch("/api/activity", { cache: "no-store" })).json();
    talking = new Set(a.speaking);
    lastSpoke = a.last_spoke;
    listening = a.listening;
    reachable = true;
  } catch (e) {
    talking = new Set();
    reachable = false;
  }
  paint();
}

async function refresh() {
  const problem = document.getElementById("problem");
  let data;
  try {
    data = await (await fetch("/api/roster", { cache: "no-store" })).json();
  } catch (e) {
    problem.textContent = "The control service is not answering.";
    problem.style.display = "block";
    return;
  }
  document.getElementById("boat").textContent = data.boat;
  document.title = data.boat + " roster";
  if (!data.ok) {
    problem.textContent = "The audio server is not answering, so the roster is unknown. Is LiveKit running?";
    problem.style.display = "block";
    return;
  }
  problem.style.display = "none";
  const root = document.getElementById("channels");
  root.replaceChildren();
  let total = 0;
  for (const ch of data.channels) {
    const sec = el("section");
    sec.append(el("h2", null, ch.name));
    if (!ch.people.length) {
      sec.append(el("div", "empty", "Nobody here"));
    } else {
      const ul = el("ul");
      for (const p of ch.people) {
        if (!p.voice) total += 1; // a test voice from the Mac is not a person
        const li = el("li", p.muted ? "is-muted" : "");
        li.dataset.id = p.identity;
        li.dataset.state = p.voice ? "Test voice" : p.headset_muted ? "Muted on headset" : (p.muted ? "Muted" : "Live");
        const bars = el("span", "bars");
        bars.append(el("i"), el("i"), el("i"));
        const who = el("span", "who");
        who.append(el("span", "name", p.name), el("span", "spoke"));
        li.append(el("span", "dot"), bars, who,
                  el("span", "state", li.dataset.state),
                  el("span", "since", since(p.joined_at)));
        ul.append(li);
      }
      sec.append(ul);
    }
    root.append(sec);
  }
  document.getElementById("count").textContent = total === 1 ? "1 aboard" : total + " aboard";
  paint();
}
refresh();
listen();
setInterval(refresh, 1000);
setInterval(listen, 250);
</script>
</body>
</html>
